<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Ilan - Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- ── Google Fonts ──────────────────────────────────────────────────────
       Plus Jakarta Sans  → body text, headings
       JetBrains Mono     → labels, key badges, code blocks               -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- ── Modular Stylesheets (load order matters for cascade) ─────────────
       variables.css    → CSS custom properties (colours, fonts, radii)
       base.css         → box-model reset, body, app wrapper
       header.css       → sticky top navigation bar
       intro.css        → intro/hero card + shared .section-label
       project-card.css → project card layout, title, description, GitHub btn
       viewer.css       → Three.js canvas panel and controls hint bar
       responsive.css   → all @media breakpoint overrides                  -->
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/intro.css">
  <link rel="stylesheet" href="styles/project-card.css">
  <link rel="stylesheet" href="styles/viewer.css">
  <link rel="stylesheet" href="styles/responsive.css">

  <!-- ── CDN Libraries (must load before our JS) ──────────────────────────
       three.min.js     → Core Three.js WebGL engine
       STLLoader.js     → Parses binary/ASCII .stl geometry
       OrbitControls.js → Mouse/touch rotate, zoom, pan controls
       marked.min.js    → Converts Markdown in descriptions to HTML        -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- ── Application Scripts (load order is required) ─────────────────────
       1. projects-data.js → defines PROJECTS_REGISTRY (data layer)
       2. stl-viewer.js    → defines STLViewer class   (3D engine wrapper)
       3. renderer.js      → defines renderProjectCard  (DOM builder)
       4. app.js           → entrypoint, wires everything together          -->
  <script src="js/projects-data.js"></script>
  <script src="js/stl-viewer.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</head>
<body>

  <div class="app-wrapper">

    <!-- ── Site Header ─────────────────────────────────────────────────────
         Sticky navigation bar. Defined in styles/header.css.
         Left: brand name + role badge.
         Right: icon links to GitHub, OpenPowerlifting, Hacker News.        -->
    <header class="site-header">
      <div class="header-brand">
        <h1>Tom Ilan</h1>
      </div>
      <div class="header-links">
        <a href="https://github.com/tom-ilan" target="_blank" class="header-link-btn" title="GitHub Profile">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
        <a href="https://www.openpowerlifting.org/u/tomilan" target="_blank" class="header-link-btn" title="OpenPowerlifting Profile">
          <img src="https://www.openpowerlifting.org/favicon.ico" alt="OpenPowerlifting" width="20" height="20">
        </a>
        <a href="https://news.ycombinator.com/submitted?id=tomilan" target="_blank" rel="noopener noreferrer" class="header-link-btn hacker-news-link" title="Hacker News submissions" aria-label="Hacker News submissions">
          <span aria-hidden="true">Y</span>
        </a>
      </div>
    </header>

    <!-- ── Main Content ─────────────────────────────────────────────────────
         Intro card takes the first viewport, then each project card follows.
         Project cards are injected dynamically by js/app.js.               -->
    <main class="main-container">

      <!-- Full-viewport intro / hero section -->
      <section class="intro-card" aria-labelledby="intro-card-title">
        <div class="intro-card-content">
          <h2 id="intro-card-title" class="intro-card-title">Tom Ilan</h2>
          <p class="intro-card-subtitle">Aspiring Engineer and Powerlifter from 🇨🇦</p>
        </div>
      </section>

      <!-- ── Featured Projects Header Banner ─────────────────────────────── -->
      <div class="projects-header-banner">
        <h2 class="projects-header-title">Featured Projects</h2>
      </div>

      <!-- Project cards are appended here by js/app.js at runtime -->
      <div id="projects-container"></div>

    </main>
  </div>

</body>
</html>
